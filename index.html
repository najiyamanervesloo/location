<html lang="en">
<head>

    <title>VeslooMapStudio Locator</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

                            100: '#dbeafe',

    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            background-color: #f0f2f5;
        }

        /* Hide Scrollbar */
        .hide-scrollbar::-webkit-scrollbar { width: 4px; }
        .hide-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .hide-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        .hide-scrollbar:hover::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.5); }
        
        .pb-safe { padding-bottom: var(--safe-bottom); }

        /* Shimmer Loading */
        .shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #f6f7f8 4%, #edeef1 25%, #f6f7f8 36%);
            background-size: 1000px 100%;
        }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        /* Card Slide-up Animation */
        .card-enter {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Leaflet Controls Fix */
        .leaflet-control-container .leaflet-top { top: 80px; }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden relative">

        <div class="relative flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-[14px] sm:rounded-[18px] bg-[#438c16] shadow-[0_8px_30px_rgba(67,140,22,0.3)] mb-5 animate-pulse">

            <!-- Logo Section -->

        <!-- MAP CONTAINER -->
        <div class="w-full h-[50vh] sm:h-[45vh] md:h-full md:flex-1 bg-[#e5e3df] md:rounded-2xl border-none md:border md:border-slate-200 relative z-0 shrink-0 shadow-inner md:shadow-sm overflow-hidden">

            <div class="absolute right-3 bottom-[45px] md:bottom-4 md:right-4 flex flex-col z-[1000]">

                <!-- Locate Control -->
                <button id="locateBtn" class="bg-white/80 backdrop-blur-md rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.1)] border border-white p-3 hover:bg-white/90 active:scale-[0.94] transition-all text-brand-600">
                    <i data-lucide="locate-fixed" class="w-5 h-5"></i>

        <!-- SIDEBAR LIST / BOTTOM SHEET -->
        <div class="w-full h-[50vh] md:h-full md:w-[420px] bg-white flex flex-col rounded-t-[26px] md:rounded-2xl -mt-8 md:mt-0 relative z-[1000] shadow-[0_-10px_40px_rgba(0,0,0,0.15)] md:shadow-sm md:border md:border-slate-200 shrink-0">
            
            <!-- Mobile Drag Handle -->
            <div class="w-12 h-[5px] bg-slate-200 rounded-full mx-auto mt-3 mb-2 md:hidden"></div>

                <!-- Desktop Only Header -->

                <!-- Desktop Stats Dashboard -->

                    <div class="bg-amber-50/80 rounded-2xl p-3 flex flex-col items-center justify-center border border-amber-100 shadow-sm">
                        <span class="text-[10px] text-amber-600 font-bold uppercase tracking-widest">Network Rating</span>
                        <div class="flex items-center gap-1 mt-1">
                            <span class="text-2xl font-extrabold text-amber-700 leading-none" id="stat-rating-desktop">-</span>
                            <i data-lucide="star" class="w-4 h-4 fill-amber-400 text-amber-400 -mt-0.5"></i>
                        </div>
                    </div>
                </div>

                <!-- Desktop Search -->
                <div class="hidden md:flex flex-col gap-2.5 mb-4 shrink-0">
                    <div class="flex items-center px-3 py-2.5 bg-white border border-slate-200 rounded-xl shadow-sm focus-within:border-brand-400 focus-within:ring-2 focus-within:ring-brand-100 transition-all">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2 shrink-0"></i>
                        <input 
                            type="text" 
                            id="sidebarSearch"
                            placeholder="Search area or school..." 
                            class="bg-transparent border-none outline-none text-sm w-full placeholder-slate-400 text-slate-700"
                        />

                </div>

                <!-- Store Cards Container & Custom Footer Wrapper -->
                <!-- Wrapper handles scroll, and ensures footer is pushed to bottom -->
                <div class="flex-1 overflow-y-auto hide-scrollbar flex flex-col pb-[100px] md:pb-4 px-1 pt-1">
                    <div id="storeListContainer" class="space-y-3 shrink-0">
                        <!-- Cards will be injected here -->
                    </div>
                    
                    <!-- Bottom Branding Footer -->
                    <div class="mt-auto pt-8 pb-2 text-center shrink-0">

                        <p class="text-[10px] sm:text-[11px] text-slate-400/80 mt-1 font-medium">

    <!-- --- MOBILE FLOATING FOOTER STATS --- -->
    <div class="md:hidden fixed bottom-0 left-0 w-full bg-white/70 backdrop-blur-[20px] border-t border-slate-200/50 shadow-[0_-10px_25px_rgba(0,0,0,0.05)] z-[2000] px-6 py-4 flex justify-between items-center rounded-t-[26px] pb-safe">
        <div class="flex flex-col">
            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-0.5">Total Branches</span>
            <span class="text-[24px] font-extrabold text-slate-800 leading-none" id="stat-total-mobile">-</span>
        </div>
        <div class="w-[1px] h-8 bg-slate-200"></div>
        <div class="flex flex-col items-end">
            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-0.5">Network Rating</span>
            <div class="flex items-center gap-1.5">
                <span class="text-[24px] font-extrabold text-slate-800 leading-none" id="stat-rating-mobile">-</span>
                <i data-lucide="star" class="w-4 h-4 fill-amber-400 text-amber-400 -mt-0.5"></i>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- App Logic -->
    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS55z-6IUnpM14Kpnyo4LRXyTBfN-T7vuye-SJkl4QrUsNFxRdqA2bnqXbd1lDvUnCSlS6rYXILxKO7/pub?gid=0&single=true&output=csv"; 

        let USER_LOCATION = { lat: 16.6925, lng: 74.2306 }; 
        let STORES = [];
        let selectedStoreId = null;
        let mapInstance = null;
        let markersLayer = null;
        let userMarker = null;

        const whatsappSvg = `<svg viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;

        document.addEventListener('DOMContentLoaded', () => {
            if (GOOGLE_SHEET_CSV_URL && GOOGLE_SHEET_CSV_URL.trim() !== "") {
                fetchDataFromGoogleSheet();
            } else {
                initializeApp();
            }
        });

        // Haversine Distance
        function calculateRealDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function updateAndSortDistances() {
            if (STORES.length === 0) return; 
            STORES.forEach(store => {
                const dist = calculateRealDistance(USER_LOCATION.lat, USER_LOCATION.lng, store.lat, store.lng);
                store.distance = dist.toFixed(1); 
            });
            STORES.sort((a, b) => {
                if (b.rating !== a.rating) return b.rating - a.rating; 
                return b.reviews - a.reviews; 
            });
        }

        function getColumnValue(row, possibleNames) {
            const rowKeys = Object.keys(row);
            for (let key of rowKeys) { if (possibleNames.includes(key.toLowerCase().trim())) return row[key]; }
            for (let key of rowKeys) {
                for (let name of possibleNames) { if (key.toLowerCase().trim().includes(name)) return row[key]; }
            }
            return null; 
        }

        function fetchDataFromGoogleSheet() {
            const container = document.getElementById('storeListContainer');
            container.innerHTML = `
                <div class="space-y-3">
                    ${[1, 2, 3].map(() => `
                        <div class="bg-white rounded-[18px] p-4 border border-slate-100 shadow-sm">
                            <div class="shimmer h-4 w-2/3 rounded mb-3"></div>
                            <div class="shimmer h-3 w-1/3 rounded mb-4"></div>
                            <div class="space-y-2">
                                <div class="shimmer h-3 w-full rounded"></div>
                                <div class="shimmer h-3 w-5/6 rounded"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            const cacheBuster = new Date().getTime();
            Papa.parse(`${GOOGLE_SHEET_CSV_URL}&t=${cacheBuster}`, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const parsedStores = results.data.map((row, index) => {
                        const latVal = getColumnValue(row, ['lat', 'latitude', 'y point']);
                        const lngVal = getColumnValue(row, ['lng', 'longitude', 'long', 'x point']);
                        return {
                            id: index + 100, 
                            name: getColumnValue(row, ['name', 'title', 'school', 'branch']) || "Nalanda School",
                            category: getColumnValue(row, ['category', 'type']) || "Educational Institution",
                            lat: parseFloat(latVal),
                            lng: parseFloat(lngVal),
                            rating: parseFloat(getColumnValue(row, ['rating', 'score'])) || 5.0,
                            reviews: parseInt(getColumnValue(row, ['reviews', 'review count'])) || 0,
                            distance: "0", 
                            address: getColumnValue(row, ['address', 'location']) || "No Address Provided",
                            phone: String(getColumnValue(row, ['phone', 'mobile', 'contact', 'whatsapp']) || ""),
                            time: getColumnValue(row, ['time', 'hours', 'status']) || "Open 09:00am - 5:00pm",
                            reviewQuote: getColumnValue(row, ['reviewquote', 'quote', 'review']) || ""
                        };
                    }).filter(s => !isNaN(s.lat) && !isNaN(s.lng)); 

                    if(parsedStores.length > 0) {
                        STORES = parsedStores; 
                        updateAnalyticsAndCategories();
                    } else {
                        STORES = []; 
                    }
                    fetchUserLocationAndInit();
                },
                error: function() { STORES = []; fetchUserLocationAndInit(); }
            });
        }

        function updateAnalyticsAndCategories() {
            const totalStr = STORES.length;
            let avgStr = '-';
            if(STORES.length > 0) {
                const avg = STORES.reduce((sum, s) => sum + s.rating, 0) / STORES.length;
                avgStr = avg.toFixed(1);
            }
            
            // Desktop Stats
            const statTotalDesktop = document.getElementById('stat-total-desktop');
            if(statTotalDesktop) statTotalDesktop.textContent = totalStr;
            const statRatingDesktop = document.getElementById('stat-rating-desktop');
            if(statRatingDesktop) statRatingDesktop.textContent = avgStr;

            // Mobile Stats
            const statTotalMobile = document.getElementById('stat-total-mobile');
            if(statTotalMobile) statTotalMobile.textContent = totalStr;
            const statRatingMobile = document.getElementById('stat-rating-mobile');
            if(statRatingMobile) statRatingMobile.textContent = avgStr;

            // Populate Category Filter in Header
            const categories = [...new Set(STORES.map(s => s.category))].filter(Boolean);
            const filterDropdown = document.getElementById('headerCategoryFilter');
            if (filterDropdown) {
                filterDropdown.innerHTML = '<option value="all">All Categories</option>';
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.toLowerCase();
                    opt.textContent = cat;
                    filterDropdown.appendChild(opt);
                });
            }
        }

        function fetchUserLocationAndInit() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        USER_LOCATION.lat = position.coords.latitude;
                        USER_LOCATION.lng = position.coords.longitude;
                        updateAndSortDistances();
                        initializeApp();
                    },
                    () => { updateAndSortDistances(); initializeApp(); },
                    { timeout: 5000 }
                );
            } else {
                updateAndSortDistances();
                initializeApp();
            }
        }

        function initializeApp() {
            initMap();
            renderList();
            
            const globalSearchInput = document.getElementById('globalSearch');
            const sidebarSearchInput = document.getElementById('sidebarSearch');
            const mobileFloatingSearch = document.getElementById('mobileFloatingSearch');
            const headerCategoryFilter = document.getElementById('headerCategoryFilter');

            // Sync interactions across all search inputs
            const updateSearches = (val) => {
                if(globalSearchInput) globalSearchInput.value = val;
                if(sidebarSearchInput) sidebarSearchInput.value = val;
                if(mobileFloatingSearch) mobileFloatingSearch.value = val;
                renderList(); renderMarkers();
            };

            if(globalSearchInput) globalSearchInput.addEventListener('input', (e) => updateSearches(e.target.value));
            if(sidebarSearchInput) sidebarSearchInput.addEventListener('input', (e) => updateSearches(e.target.value));
            if(mobileFloatingSearch) mobileFloatingSearch.addEventListener('input', (e) => updateSearches(e.target.value));
            
            if(headerCategoryFilter) {
                headerCategoryFilter.addEventListener('change', () => {
                    renderList(); renderMarkers();
                    selectedStoreId = null;
                });
            }

            document.getElementById('zoomInBtn').addEventListener('click', () => mapInstance.zoomIn());
            document.getElementById('zoomOutBtn').addEventListener('click', () => mapInstance.zoomOut());
            
            document.getElementById('locateBtn').addEventListener('click', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        USER_LOCATION.lat = pos.coords.latitude;
                        USER_LOCATION.lng = pos.coords.longitude;
                        mapInstance.flyTo([USER_LOCATION.lat, USER_LOCATION.lng], 14, { duration: 1 });
                        selectedStoreId = null;
                        if(userMarker) userMarker.setLatLng([USER_LOCATION.lat, USER_LOCATION.lng]);
                        updateAndSortDistances();
                        renderList();
                        renderMarkers();
                    });
                }
            });

            window.addEventListener('resize', () => { if(mapInstance) mapInstance.invalidateSize(); });
            lucide.createIcons();

            // Hide the App Preloader with smooth fade after initialization
            setTimeout(() => {
                const preloader = document.getElementById('app-preloader');
                if (preloader) {
                    preloader.style.opacity = '0';
                    setTimeout(() => preloader.remove(), 500); // Wait for transition
                }
            }, 600); // 600ms base delay to let map and icons load
        }

        function initMap() {
            if (mapInstance) { mapInstance.remove(); }
            mapInstance = L.map('mapContainer', { zoomControl: false, attributionControl: false });
            L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(mapInstance);
            markersLayer = L.layerGroup().addTo(mapInstance);

            const userIconHTML = `<div style="transform: translate(-50%, -50%);" class="flex flex-col items-center pointer-events-none"><div class="w-12 h-12 bg-blue-500 rounded-full opacity-20 absolute animate-ping"></div><div class="w-4 h-4 bg-blue-600 rounded-full border-[3px] border-white shadow-md relative z-10"></div></div>`;
            const userIcon = L.divIcon({ className: 'bg-transparent border-none', html: userIconHTML, iconSize: [0,0] });
            userMarker = L.marker([USER_LOCATION.lat, USER_LOCATION.lng], { icon: userIcon, interactive: false }).addTo(mapInstance);

            renderMarkers();

            if (STORES.length > 0) {
                const bounds = L.latLngBounds(STORES.map(store => [store.lat, store.lng]));
                mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
            } else {
                mapInstance.setView([16.6925, 74.2306], 13); 
            }
        }

        function getFilteredStores() {
            // Check whichever input is visible/active
            const query = (window.innerWidth < 768 ? document.getElementById('mobileFloatingSearch').value : document.getElementById('sidebarSearch').value).toLowerCase();
            const catFilter = document.getElementById('headerCategoryFilter') ? document.getElementById('headerCategoryFilter').value : 'all';
            
            return STORES.filter(store => {
                const matchesSearch = store.name.toLowerCase().includes(query) || store.address.toLowerCase().includes(query);
                const matchesCat = catFilter === 'all' || store.category.toLowerCase() === catFilter;
                return matchesSearch && matchesCat;
            });
        }

        function renderMarkers() {
            if (!markersLayer) return;
            markersLayer.clearLayers();

            getFilteredStores().forEach(store => {
                const isSelected = selectedStoreId === store.id;
                
                const iconHTML = `
                    <div style="transform: translate(-50%, -100%); width: max-content;" class="flex items-center relative gap-1 transition-all duration-300 ${isSelected ? 'scale-110 z-[1000]' : 'hover:scale-105 z-[500]'}">
                        <div class="hidden sm:block px-3 py-1.5 text-[11px] font-extrabold rounded-lg shadow-lg whitespace-nowrap ${isSelected ? 'bg-slate-900 text-white' : 'bg-white text-slate-800'}">
                            ${store.name}
                        </div>
                        <div class="relative flex flex-col items-center">
                            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center text-white font-bold shadow-xl border-2 ${isSelected ? 'bg-gradient-to-br from-brand-500 to-brand-700 border-white ring-4 ring-brand-300/50' : 'bg-gradient-to-br from-brand-400 to-brand-600 border-white'}">
                                N
                            </div>
                            <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 absolute -bottom-1 sm:-bottom-1.5 rotate-45 ${isSelected ? 'bg-brand-700' : 'bg-brand-600'}"></div>
                        </div>
                    </div>
                `;

                const icon = L.divIcon({ className: 'bg-transparent border-none', html: iconHTML, iconSize: null });
                const marker = L.marker([store.lat, store.lng], { icon }).addTo(markersLayer);
                marker.on('click', () => selectStore(store.id));
            });
        }

        function selectStore(id) {
            selectedStoreId = id;
            const store = STORES.find(s => s.id === id);
            
            if (store && mapInstance) {
                const isMobile = window.innerWidth < 768;
                const offsetLat = isMobile ? store.lat + 0.003 : store.lat;
                mapInstance.flyTo([offsetLat, store.lng], 15, { duration: 0.8 });
            }
            
            renderList();
            renderMarkers();
            
            if(window.innerWidth < 768) {
                setTimeout(() => {
                    const activeCard = document.getElementById(`store-card-${id}`);
                    if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            }
        }

        function generateStars(rating) {
            let starsHTML = '';
            for(let i = 0; i < 5; i++) {
                const isFilled = i < Math.floor(rating);
                starsHTML += `<i data-lucide="star" class="w-3.5 h-3.5 ${isFilled ? 'fill-amber-400 text-amber-400' : 'text-slate-200'}"></i>`;
            }
            return starsHTML;
        }

        function renderList() {
            const container = document.getElementById('storeListContainer');
            const filteredStores = getFilteredStores();
            container.innerHTML = ''; 

            if (filteredStores.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center flex flex-col items-center justify-center h-full text-slate-400">
                        <i data-lucide="map-x" class="w-10 h-10 mb-3 opacity-50"></i>
                        <p class="font-medium text-sm">Koi branch nahi mili.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filteredStores.forEach((store, index) => {
                const isSelected = selectedStoreId === store.id;
                
                // Add animated slide-up classes
                const cardHTML = `
                    <div id="store-card-${store.id}" class="card-enter bg-white rounded-[18px] p-4 border ${isSelected ? 'border-brand-400 shadow-[0_4px_15px_rgba(59,130,246,0.15)] bg-brand-50/30' : 'border-slate-200 shadow-sm hover:-translate-y-[1px] hover:shadow-[0_4px_12px_rgba(59,130,246,0.12)]'} transition-all cursor-pointer relative overflow-hidden" style="animation-delay: ${index * 40}ms" onclick="selectStore(${store.id})">
                        ${isSelected ? '<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-brand-400 to-brand-600"></div>' : ''}
                        
                        <div class="flex justify-between items-start gap-2 mb-1.5 pl-1.5">
                            <h3 class="font-bold text-[16px] sm:text-[17px] leading-snug ${isSelected ? 'text-brand-700' : 'text-slate-800'} pr-2">${store.name}</h3>
                            <span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] font-bold border border-slate-200 whitespace-nowrap shrink-0">${store.category}</span>
                        </div>
                        
                        <!-- Rating and Distance Inline -->
                        <div class="flex items-center gap-2 mb-3.5 pl-1.5">
                            <span class="text-[13px] font-bold text-slate-800">${store.rating}</span>
                            <div class="flex text-amber-400">
                                ${generateStars(store.rating)}
                            </div>
                            <span class="text-[11px] text-slate-400 font-medium">(${store.reviews})</span>
                            <span class="bg-brand-50 text-brand-600 px-2 py-[2px] rounded-full text-[10px] font-bold tracking-wide">${store.distance} km</span>
                        </div>
                        
                        <div class="space-y-3.5 pl-1.5">
                            <div class="flex items-start gap-2.5">
                                <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 mt-0.5 shrink-0"></i>
                                <span class="text-[13px] text-slate-600 leading-snug">${store.address}</span>
                            </div>
                            
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2.5">
                                    <i data-lucide="phone" class="w-4 h-4 text-slate-400 shrink-0"></i>
                                    <span class="text-[13px] text-slate-700 font-medium">${store.phone}</span>
                                </div>
                                
                                <button onclick="event.stopPropagation(); window.open('https://wa.me/91${store.phone.replace(/[^0-9]/g, '')}')" class="flex items-center gap-1.5 bg-[#25D366] hover:bg-[#20bd5a] text-white rounded-full text-[12px] font-bold transition-all shadow-sm active:scale-[0.96]" style="padding: 6px 14px;">
                                    ${whatsappSvg} Chat
                                </button>
                            </div>

                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2.5">
                                    <i data-lucide="clock" class="w-4 h-4 text-slate-400 shrink-0"></i>
                                    <span class="text-[13px] text-slate-600">Status: <span class="text-slate-800 font-medium">${store.time}</span></span>
                                </div>
                                
                                <button onclick="event.stopPropagation(); window.open('https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lng}&dirflg=d')" class="flex items-center gap-1.5 bg-brand-50 hover:bg-brand-100 text-brand-600 border border-brand-100 rounded-full text-[12px] font-bold transition-all shadow-sm active:scale-[0.96]" style="padding: 6px 14px;">
                                    <i data-lucide="corner-up-right" class="w-3.5 h-3.5"></i> Route
                                </button>
                            </div>
                        </div>

                        <!-- Review Quote Block -->
                        ${store.reviewQuote ? `
                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-start gap-2 relative pl-3">
                            <div class="absolute left-0 top-4 bottom-0 w-[3px] bg-brand-300 rounded-full"></div>
                            <span class="text-brand-200 text-[32px] absolute -top-1.5 left-2 leading-none">"</span>
                            <p class="text-[12px] text-slate-500 italic leading-relaxed pl-4 pt-1 font-medium">
                                ${store.reviewQuote}
                            </p>
                        </div>
                        ` : ''}
                    </div>
                `;
                
                container.insertAdjacentHTML('beforeend', cardHTML);
            });

            lucide.createIcons();
        }
    </script>
</body>
</html>
